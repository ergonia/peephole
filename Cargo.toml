[package]
name = "fast_instruction"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-sdk = { version = "=1.18", default_features = false}
solana-program = { version = "=1.18", default_features = false}
bytemuck = { version = "1.18.0", features = ["derive"] }


[dev-dependencies]
solana-program-test = "=1.18"
tokio = { version = "1.8.4", features = ["full"] }
solana-client = "=1.18"
solana-account-decoder = ">=1.13"
anyhow = "1"
serde_json = "1.0.114"
serde = "1.0.197"
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"

[lib]
crate-type = ["cdylib", "lib"]