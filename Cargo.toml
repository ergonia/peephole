[package]
name = "fast_instruction"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-sdk = { version = "=1.18", features = [] }
bytemuck = { version = "1.18.0", features = ["derive"] }
arbitrary = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"

[features]
fuzzing = ["solana-sdk/full", "dep:arbitrary"]
