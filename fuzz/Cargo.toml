[package]
name = "peephole-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }


[dependencies.peephole]
path = ".."
features = ["fuzzing", "pinocchio-sdk"]
default-features = false

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_account_structure"
path = "fuzz_targets/fuzz_account_structure.rs"
test = false
doc = false
